[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdlc-automation"
version = "0.1.0"
description = "Event-driven pull request documentation automation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "langgraph>=0.2,<1",
  "langchain-core>=0.3,<1",
  "langchain-openai>=0.2,<1",
  "PyGithub>=2.4,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.5,<3",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
